<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Food</title>

    <link href="css/style.css" rel="stylesheet"/>

    <script src="js/script.js" defer></script>

</head>
<body>
<header>
    <h1>Scan Food</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="scan.html">Scan Food</a>
        <a href="my-food.html">My Food</a>
    </nav>
</header>

<main>
  <!-- The scanner with buttons -->
    <p>
        Point your camera at the food and take a photo to check its expiration date
    </p>

    <label for="food-photo">Take Photo</label>
    <input id="food-photo" type="file" accept="image/*" capture="environment"/>

    <img alt="Preview of the selected product" id="preview-food"/>

    <button type="button" id="scan-button" disabled aria-live="polite">Scan Food</button>
    <p id="scan-message" aria-live="polite"></p>
</main>

</body>
</html>
