<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Food</title>

    <link href="css/style.css" rel="stylesheet"/>


    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/script.js" defer></script>

</head>
<body>
<header>
  <h1>Scan Food</h1>
</header>

<main>
  <!-- The scanner with buttons -->
    <p>
        Point your camera at the food and take a photo to check its expiration date
    </p>

    <label for="food-photo">Take Photo</label>
    <input id="food-photo" type="file" accept="image/*" capture="environment"/>

    <img alt="" id="preview-food"/>

    <button type="button" id="scan-button" disabled>Scan Food</button>
</main>

</body>
</html>
